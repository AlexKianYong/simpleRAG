<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNGD FAQ Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Styling for the clickable links */
        .message-content a {
            font-weight: 600;
            word-break: break-all; 
            text-decoration: underline;
        }

        /* Color for links in the Bot's bubble */
        .message-bot .message-content a {
            color: #764ba2; 
        }

        /* Color for links in the User's bubble (if any) */
        .message-user .message-content a {
            color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f9fc;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message-user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-bot .message-content {
            background: #e8eef7;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-blocked .message-content {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .message-loading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            animation: spin 1s infinite;
        }

        .spinner:nth-child(2) {
            animation-delay: 0.2s;
            background: #764ba2;
        }

        .spinner:nth-child(3) {
            animation-delay: 0.4s;
            background: #667eea;
        }

        @keyframes spin {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .metadata {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #c62828;
        }

        .info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #1565c0;
            text-align: center;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                max-height: none;
            }

            header h1 {
                font-size: 20px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> TNGD FAQ Bot</h1>
            <p>Ask questions about Touch 'n Go eWallet</p>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="info">
                👋 Welcome! Ask me anything about Touch 'n Go eWallet
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="questionInput"
                placeholder="Ask a question about TNG eWallet..."
                autocomplete="off"
            />
            <button id="sendButton" onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');

        // Focus input on load
        questionInput.focus();

        // Send on Enter key
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });

        // This "finds" URLs and wraps them in <a> tags
        function linkify(text) {
            const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
            return text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
        }

        function addMessage(text, isUser = false, isBlocked = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            
            if (isUser) {
                messageDiv.classList.add('message-user');
            } else {
                messageDiv.classList.add('message-bot');
                if (isBlocked) {
                    messageDiv.classList.add('message-blocked');
                }
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (isUser) {
                contentDiv.textContent = text; // Keep user text safe
            } else {
                contentDiv.innerHTML = linkify(text); // Convert bot text to links
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message message-bot';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content message-loading';
            contentDiv.innerHTML = '<div class="spinner"></div><div class="spinner"></div><div class="spinner"></div>';
            
            messageDiv.appendChild(contentDiv);
            messageDiv.id = 'loadingMessage';
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        async function sendQuestion() {
            const question = questionInput.value.trim();

            if (!question) {
                return;
            }

            // Add user message
            addMessage(question, true);
            questionInput.value = '';
            questionInput.focus();

            // Show loading state
            sendButton.disabled = true;
            showLoadingMessage();

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                removeLoadingMessage();

                if (!response.ok) {
                    const error = await response.json();
                    addMessage('❌ Error: ' + (error.error || 'Unknown error'), false, true);
                    return;
                }

                const data = await response.json();

                if (data.blocked) {
                    addMessage('🚫 ' + data.answer, false, true);
                } else {
                    addMessage(data.answer, false, false);
                    
                    // Add metadata
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'chat-message message-bot';
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'metadata';
                    metaDiv.textContent = `📚 Retrieved ${data.chunk_count} context chunks`;
                    messageDiv.appendChild(metaDiv);
                    chatContainer.appendChild(messageDiv);
                }

            } catch (error) {
                removeLoadingMessage();
                addMessage('❌ Connection error: ' + error.message, false, true);
            } finally {
                sendButton.disabled = false;
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
